server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Hashed Vite assets are immutable; index.html must never be cached or a
    # deploy leaves browsers pointing at deleted bundles.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The trailing slash on proxy_pass strips the /api prefix, so the Rust
    # router keeps its flat top-level paths (/health, /quotations, ...).
    location /api/ {
        proxy_pass http://api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: the quotation event stream is long-lived and must not be buffered.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Client-side routes (/cotacoes/:id, /fornecedores, ...) are served the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
